name: Java CI

on:
  push:
    branches: [ master]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: mvn --batch-mode compile

      - name: Build (package)
        run: mvn --batch-mode package

      - name: Test
        run: mvn --batch-mode test
